<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Koşucu 3D</title>
<style>
:root{--bg:#0b1020;--fg:#fff;--panel:rgba(10,16,32,.8);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#0b1020;--fg:#fff;--panel:rgba(10,16,32,.8)}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;font-weight:700;font-size:20px;pointer-events:none}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel);text-align:center;padding:24px}
#menu h1{margin:0 0 8px;font-size:34px;color:#4df3ff}
#menu p{margin:4px 0 20px;opacity:.85}
button{font-size:20px;font-weight:700;padding:14px 36px;border:0;border-radius:30px;background:#ff3d81;color:#fff}
#ctl{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;display:flex;justify-content:space-between;padding:0 20px}
#ctl div{width:30vw;max-width:130px;height:64px;border-radius:32px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:30px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span>Skor: <b id="s">0</b></span><span>Rekor: <b id="b">0</b></span></div>
<div id="ctl"><div id="L">◀</div><div id="R">▶</div></div>
<div id="menu"><h1>NEON KOŞUCU</h1><p id="msg">Kırmızı engellerden kaç, sarı elmasları topla!<br>Ok tuşları, kaydırma veya alttaki butonlar.</p><button id="go">Başla</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
const sc=new THREE.Scene();sc.background=new THREE.Color(0x0b1020);sc.fog=new THREE.Fog(0x0b1020,20,70);
const cam=new THREE.PerspectiveCamera(65,1,.1,100);cam.position.set(0,4,7);cam.lookAt(0,0,-6);
sc.add(new THREE.AmbientLight(0xffffff,.6));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(3,8,5);sc.add(dl);
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);R.setPixelRatio(Math.min(devicePixelRatio,2));cam.aspect=w/h;cam.fov=w<h?80:65;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
// zemin
const floor=new THREE.Mesh(new THREE.PlaneGeometry(8,200),new THREE.MeshStandardMaterial({color:0x141c3a}));
floor.rotation.x=-Math.PI/2;floor.position.z=-80;sc.add(floor);
const lines=[];
for(let i=0;i<30;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(8,.08),new THREE.MeshBasicMaterial({color:0x4df3ff}));m.rotation.x=-Math.PI/2;m.position.set(0,.01,-i*3);sc.add(m);lines.push(m)}
[-1,1].forEach(x=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.1,.1,200),new THREE.MeshBasicMaterial({color:0xff3d81}));m.position.set(x*3,.05,-80);sc.add(m)});
// şehir ve yıldızlar
const bld=[];
for(let s=-1;s<=1;s+=2)for(let i=0;i<14;i++){const h=3+Math.random()*10;const m=new THREE.Mesh(new THREE.BoxGeometry(2.5,h,2.5),new THREE.MeshStandardMaterial({color:0x1a2350,emissive:[0x3a0f5a,0x0f3a5a,0x5a0f3a][i%3],emissiveIntensity:.8}));m.position.set(s*(6+Math.random()*3),h/2,-i*7);sc.add(m);bld.push(m)}
const sp=new Float32Array(600);for(let i=0;i<200;i++){sp[i*3]=(Math.random()-.5)*120;sp[i*3+1]=8+Math.random()*30;sp[i*3+2]=-Math.random()*100}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
sc.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.25})));
// oyuncu
const pl=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0x4df3ff,emissive:0x0a5560}));
pl.position.y=.5;sc.add(pl);
pl.add(new THREE.LineSegments(new THREE.EdgesGeometry(pl.geometry),new THREE.LineBasicMaterial({color:0xffffff})));
const glow=new THREE.PointLight(0x4df3ff,1.5,8);pl.add(glow);
const LX=[-2,0,2];let lane=1,items=[],score=0,speed=14,run=false,t=0,spawn=0;
let best=0;try{best=+localStorage.getItem('nk')||0}catch(e){}
const $=id=>document.getElementById(id);$('b').textContent=best;
const gO=new THREE.BoxGeometry(1.4,1.4,1.4),mO=new THREE.MeshStandardMaterial({color:0xff2b3a,emissive:0x550008});
const gC=new THREE.OctahedronGeometry(.4),mC=new THREE.MeshStandardMaterial({color:0xffd23d,emissive:0x806000});
function add(){
  const l=Math.floor(Math.random()*3),coin=Math.random()<.45;
  const m=new THREE.Mesh(coin?gC:gO,coin?mC:mO);
  m.position.set(LX[l],coin?.8:.7,-70);m.userData={coin,l};sc.add(m);items.push(m);
}
function move(d){if(!run)return;const o=lane;lane=Math.max(0,Math.min(2,lane+d));if(o!==lane)sfx.move()}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1)});
$('L').addEventListener('pointerdown',()=>move(-1));$('R').addEventListener('pointerdown',()=>move(1));
let sx=null;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>30)move(dx>0?1:-1);sx=null},{passive:true});
// ses
let AC=null,mus=null,ni=0,shake=0;
function tone(f,d,type,v,sl){if(!AC)return;const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t0+d);g.gain.setValueAtTime(v||.1,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t0+d)}
const sfx={coin(){tone(880,.08,'square',.08);setTimeout(()=>tone(1320,.15,'square',.08),70)},move(){tone(300,.07,'triangle',.08,550)},crash(){tone(220,.6,'sawtooth',.2,35)}};
const notes=[220,261.6,329.6,392,329.6,261.6,246.9,293.7,370,440,370,293.7];
function music(){if(mus)clearInterval(mus);mus=setInterval(()=>{if(!run)return;tone(notes[ni%12],.2,'triangle',.07);if(ni%4===0)tone(110,.35,'sine',.12);ni++},170)}
// parçacıklar
const parts=[],pg=new THREE.BoxGeometry(.15,.15,.15);
function burst(p,c,n){for(let i=0;i<n;i++){const m=new THREE.Mesh(pg,new THREE.MeshBasicMaterial({color:c}));m.position.copy(p);m.userData.v=new THREE.Vector3((Math.random()-.5)*6,Math.random()*5,(Math.random()-.5)*6);m.userData.l=1;sc.add(m);parts.push(m)}}
function start(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();music();items.forEach(m=>sc.remove(m));items=[];score=0;speed=14;lane=1;spawn=0;run=true;$('menu').style.display='none';$('s').textContent=0}
function over(){
  run=false;sfx.crash();shake=.6;burst(pl.position,0xff2b3a,30);if(score>best){best=score;$('b').textContent=best;try{localStorage.setItem('nk',best)}catch(e){}}
  $('msg').innerHTML='Oyun bitti! Skorun: <b>'+score+'</b>';$('go').textContent='Tekrar oyna';$('menu').style.display='flex';
}
$('go').addEventListener('click',start);
let last=performance.now();
function loop(n){
  requestAnimationFrame(loop);
  const dt=Math.min((n-last)/1000,.05);last=n;t+=dt;
  pl.position.x+=(LX[lane]-pl.position.x)*Math.min(1,dt*14);
  pl.rotation.z=(pl.position.x-LX[lane])*.3;pl.rotation.y+=dt*2;
  if(run){
    speed+=dt*.25;spawn-=dt;
    if(spawn<=0){add();spawn=Math.max(.35,.9-speed*.02)}
    for(let i=items.length-1;i>=0;i--){
      const m=items[i];m.position.z+=speed*dt;
      if(m.userData.coin)m.rotation.y+=dt*4;
      if(Math.abs(m.position.z)<.9&&Math.abs(m.position.x-pl.position.x)<1){
        if(m.userData.coin){score+=10;sfx.coin();burst(m.position,0xffd23d,12);$('s').textContent=score;sc.remove(m);items.splice(i,1);continue}
        else{over();break}
      }
      if(m.position.z>9){sc.remove(m);items.splice(i,1)}
    }
    lines.forEach(l=>{l.position.z+=speed*dt;if(l.position.z>8)l.position.z-=90});
    bld.forEach(b=>{b.position.z+=speed*dt;if(b.position.z>10)b.position.z-=98});
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i],u=p.userData;u.v.y-=12*dt;p.position.addScaledVector(u.v,dt);u.l-=dt*1.6;p.scale.setScalar(Math.max(.01,u.l));if(u.l<=0){sc.remove(p);parts.splice(i,1)}}
  shake=Math.max(0,shake-dt);cam.position.x=(Math.random()-.5)*shake;cam.position.y=4+(Math.random()-.5)*shake;
  R.render(sc,cam);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
